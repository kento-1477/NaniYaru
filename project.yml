name: NaniYaru
options:
  bundleIdPrefix: com.a81808
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
configs:
  Debug: debug
  Release: release

targets:
  NaniYaru:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Config/NaniYaru-Info.plist
      properties:
        CFBundleDisplayName: "NaniYaru⁉︎"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.a81808.naniyaru
            CFBundleURLSchemes:
              - naniyaru
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a81808.naniyaru
        PRODUCT_NAME: NaniYaru
        CODE_SIGN_ENTITLEMENTS: Config/NaniYaru.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: NaniYaruWidgetExtension
        embed: true

  NaniYaruWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Config/NaniYaruWidget-Info.plist
      properties:
        CFBundleDisplayName: "NaniYaru Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a81808.naniyaru.widget
        PRODUCT_NAME: NaniYaruWidgetExtension
        CODE_SIGN_ENTITLEMENTS: Config/NaniYaruWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  NaniYaruTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NaniYaruTests
    info:
      path: Config/NaniYaruTests-Info.plist
      properties:
        CFBundleDisplayName: "NaniYaruTests"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a81808.naniyaru.tests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: NaniYaru

schemes:
  NaniYaru:
    build:
      targets:
        NaniYaru: all
        NaniYaruWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NaniYaruTests
