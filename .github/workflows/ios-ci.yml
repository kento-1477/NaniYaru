name: iOS CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (iOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve simulator destination
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          DEST_LINE="$(xcodebuild -project NaniYaru.xcodeproj -scheme NaniYaru -showdestinations \
            | tr -d '\r' \
            | grep 'platform:iOS Simulator' \
            | grep -v 'placeholder' \
            | head -n 1 || true)"
          DEST_ID="$(printf '%s\n' "$DEST_LINE" | sed -nE 's/.*id:([^,}]+).*/\1/p')"

          if [ -z "$DEST_ID" ]; then
            echo "No compatible iOS Simulator destination found."
            echo "---- showdestinations ----"
            xcodebuild -project NaniYaru.xcodeproj -scheme NaniYaru -showdestinations || true
            exit 1
          fi

          echo "Using destination: $DEST_LINE"
          echo "destination=id=$DEST_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NaniYaru.xcodeproj \
            -scheme NaniYaru \
            -destination "${{ steps.destination.outputs.destination }}" \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES \
            test
